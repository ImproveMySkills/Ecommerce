version: '3.9'

services:
  discovery-service:
    build: ./DiscoveryService
    ports:
      - "8761:8761"
    networks:
      - spring-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  config-service:
    build:
      context: .
      dockerfile: ConfigService/Dockerfile
    ports:
      - "9999:9999"
    depends_on:
      - discovery-service
    networks:
      - spring-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  gateway-service:
    build:
      context: .
      dockerfile: GatewayService/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
      - config-service
    networks:
      - spring-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - discovery-service
      - config-service
      - gateway-service
    networks:
      - spring-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  customer-service:
    build:
      context: .
      dockerfile: CustomerService/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
      - config-service
      - gateway-service
    networks:
      - spring-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  product-service:
    build:
      context: .
      dockerfile: ProductService/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service
      - config-service
      - gateway-service
    networks:
      - spring-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  #  vault-service:
  #    build: ./vault-service
  #    ports:
  #      - "8200:8200"
  #    environment:
  #      VAULT_DEV_ROOT_TOKEN_ID: root
  #      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
  #    cap_add:
  #      - IPC_LOCK
  #    networks:
  #      - spring-net
  #    healthcheck:
  #      test: ["CMD", "curl", "-f", "http://localhost:8200/v1/sys/health"]
  #      interval: 30s
  #      timeout: 10s
  #      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
    ports:
      - "8585:8585"
      - "8443:8443"
    networks:
      - spring-net
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keyssh/server.crt:/opt/keycloak/conf/server.crt:ro
      - ./keyssh/server.key:/opt/keycloak/conf/server.key:ro

networks:
  spring-net:
    driver: bridge

volumes:
  keycloak_data: